/* =========================================================
   Смайл+ — базовые стили сайта
   Источник токенов: design-system/index.html (раздел 17)
   Не менять палитру/шрифты без обновления дизайн-системы.
   ========================================================= */

:root{
  --color-bg-primary:#F6F1E7;
  --color-bg-secondary:#EDE3D3;
  --color-surface:#FBF8F2;
  --color-sand:#E4D9C4;
  --color-sage:#9CAA8E;
  --color-olive:#5B6146;
  --color-olive-dark:#454A36;
  --color-clay:#B57A54;
  --color-clay-dark:#9C6743;
  --color-text-primary:#2E2B1F;
  --color-text-secondary:#6B6656;
  --color-line:#DCD3BF;
  --color-fill-soft:#EDF0E7;
  --color-success:#7A9172;
  --color-error:#B15C46;

  --font-display:&#x27;Cormorant Garamond&#x27;,&#x27;Prata&#x27;,Georgia,serif;
  --font-body:&#x27;Commissioner&#x27;,&#x27;Onest&#x27;,-apple-system,BlinkMacSystemFont,sans-serif;

  --space-3xs:4px; --space-2xs:8px; --space-xs:12px; --space-sm:16px;
  --space-md:24px; --space-lg:40px; --space-xl:64px; --space-2xl:96px; --space-3xl:144px;

  --radius-sm:4px; --radius-md:12px; --radius-lg:24px; --radius-xl:40px;

  --shadow-whisper:0 1px 2px rgba(46,43,31,.05);
  --shadow-soft:0 8px 24px rgba(46,43,31,.08);
  --shadow-float:0 16px 40px rgba(46,43,31,.14);

  --container-max:1200px;
  --duration-fast:150ms;
  --ease-standard:cubic-bezier(.4,0,.2,1);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; background:var(--color-bg-primary); color:var(--color-text-primary);
  font-family:var(--font-body); font-size:16px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
img,svg{max-width:100%; display:block;}
a{color:inherit; text-decoration:none;}
.container{max-width:var(--container-max); margin:0 auto; padding:0 var(--space-lg);}

h1,h2,h3,h4{font-family:var(--font-display); font-weight:500; margin:0;}

.eyebrow{
  font-family:var(--font-body); font-weight:600; font-size:13px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--color-clay-dark); margin-bottom:var(--space-sm);
  display:flex; align-items:center; gap:var(--space-2xs);
}
.eyebrow::before{content:&quot;&quot;; width:22px; height:1px; background:var(--color-clay-dark); display:inline-block;}

/* ---------- Кнопки ---------- */
.btn{
  font-family:var(--font-body); font-weight:600; font-size:15px; letter-spacing:.01em;
  padding:14px 28px; border-radius:999px; border:1.5px solid transparent; cursor:pointer;
  transition:all var(--duration-fast) var(--ease-standard); display:inline-flex; align-items:center; gap:8px;
}
.btn-primary{background:var(--color-clay); color:#fff;}
.btn-primary:hover{background:var(--color-clay-dark); transform:translateY(-1px); box-shadow:var(--shadow-soft);}
.btn-primary:focus-visible{outline:3px solid var(--color-sage); outline-offset:2px;}
.btn-primary:active{transform:translateY(0); background:var(--color-clay-dark);}
.btn-primary:disabled{background:var(--color-line); color:var(--color-text-secondary); cursor:not-allowed; transform:none; box-shadow:none;}
.btn-secondary{background:transparent; border-color:var(--color-olive); color:var(--color-olive-dark);}
.btn-secondary:hover{background:var(--color-fill-soft);}
.btn-secondary:focus-visible{outline:3px solid var(--color-sage); outline-offset:2px;}

/* ---------- Формы ---------- */
.field-group{margin-bottom:var(--space-md); text-align:left;}
.field-label{display:block; font-size:13px; font-weight:600; margin-bottom:6px;}
.field-input{
  width:100%; font-family:var(--font-body); font-size:15px; padding:13px 16px;
  border:1.5px solid var(--color-line); border-radius:var(--radius-md); background:var(--color-surface);
  color:var(--color-text-primary); transition:border-color var(--duration-fast);
}
.field-input:focus{outline:none; border-color:var(--color-olive);}
.field-input.error{border-color:var(--color-error);}
.field-hint{font-size:12px; color:var(--color-text-secondary); margin-top:5px;}
.field-hint.error{color:var(--color-error);}
.checkline{display:flex; align-items:flex-start; gap:10px; font-size:14px; margin-bottom:16px; text-align:left; line-height:1.5;}
.checkline input{width:18px; height:18px; accent-color:var(--color-olive); margin-top:2px; flex-shrink:0;}
.checkline a{text-decoration:underline; text-underline-offset:3px;}
.form-status{font-size:14px; margin-top:var(--space-sm); display:none;}
.form-status.visible{display:block;}
.form-status.error{color:var(--color-error);}
.form-status.success{color:var(--color-success);}

/* ---------- Карточки ---------- */
.card{
  background:var(--color-surface); border:1px solid var(--color-line); border-radius:var(--radius-lg);
  padding:var(--space-lg); box-shadow:var(--shadow-whisper);
}
.card.arch-top{border-radius:120px 120px var(--radius-lg) var(--radius-lg); text-align:center; padding-top:var(--space-2xl);}

/* ---------- Разделы лендинга ---------- */
section{padding:var(--space-3xl) 0; border-bottom:1px solid var(--color-line);}
section:last-of-type{border-bottom:none;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:var(--space-xl);}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-md);}
.lead{font-size:22px; line-height:1.55; color:var(--color-text-primary); max-width:760px;}

/* ---------- Шапка ---------- */
.site-header{
  position:sticky; top:0; z-index:100; background:rgba(246,241,231,.92); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--color-line); display:flex; align-items:center; justify-content:space-between;
  padding:16px var(--space-lg);
}
.site-logo{font-family:var(--font-display); font-size:22px;}

/* ---------- Первый экран ---------- */
.hero{
  padding:var(--space-3xl) 0; text-align:center; position:relative; overflow:hidden;
  background:radial-gradient(ellipse 60% 50% at 85% 15%, rgba(156,170,142,.3), transparent 60%), var(--color-bg-primary);
}
.hero-arch{
  position:absolute; right:6%; top:10%; width:260px; height:360px;
  border:1.5px solid var(--color-olive); opacity:.25; border-radius:130px 130px 0 0; border-bottom:none;
}
.hero h1{font-size:clamp(36px,5vw,64px); line-height:1.05; max-width:820px; margin:0 auto;}
.hero p{font-size:20px; color:var(--color-text-secondary); max-width:560px; margin:var(--space-md) auto 0;}
.hero-actions{display:flex; gap:12px; justify-content:center; margin-top:var(--space-lg); flex-wrap:wrap;}

/* ---------- Узнавание (2 ветки) ---------- */
.split-cards{display:grid; grid-template-columns:1fr 1fr; gap:var(--space-lg); margin-top:var(--space-xl);}
.split-card{padding:var(--space-xl); border-radius:var(--radius-lg);}
.split-card.pain{background:var(--color-bg-secondary);}
.split-card.care{background:var(--color-fill-soft);}

/* ---------- Шаги визита ---------- */
.steps{display:grid; grid-template-columns:repeat(4,1fr); gap:var(--space-md); margin-top:var(--space-xl); counter-reset:step;}
.step{position:relative; padding-top:var(--space-md);}
.step .num{font-family:var(--font-display); font-size:48px; color:var(--color-sage);}

/* ---------- Доверие ---------- */
.trust-block{display:grid; grid-template-columns:280px 1fr; gap:var(--space-xl); align-items:center; margin-top:var(--space-xl);}
.doctor-photo{
  aspect-ratio:3/4; border-radius:130px 130px var(--radius-lg) var(--radius-lg);
  background:var(--color-sand); overflow:hidden;
  display:flex; align-items:center; justify-content:center; color:var(--color-olive-dark); font-size:13px; text-align:center; padding:0;
}
.doctor-photo img{width:100%; height:100%; object-fit:cover; object-position:top center;}
.credentials-list{list-style:none; padding:0; margin-top:var(--space-md);}
.credentials-list li{padding:10px 0; border-bottom:1px solid var(--color-line); font-size:15px;}

/* ---------- Отзывы ---------- */
.reviews{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-md); margin-top:var(--space-xl);}
.review-card{background:var(--color-surface); border:1px solid var(--color-line); border-radius:var(--radius-lg); padding:var(--space-lg);}
.review-quote{font-family:var(--font-display); font-style:italic; font-size:19px; line-height:1.5; color:var(--color-olive-dark);}
.review-source{font-size:12px; color:var(--color-text-secondary); margin-top:var(--space-sm);}

/* ---------- Стоимость ---------- */
.price-card{background:var(--color-olive); color:var(--color-bg-primary); border-radius:var(--radius-lg); padding:var(--space-2xl); text-align:center; margin-top:var(--space-xl);}
.price-card h3{color:#fff;}
.price-card p{opacity:.85; margin-top:10px;}

/* ---------- Снятие страха / кому подходит ---------- */
.fear-block{display:grid; grid-template-columns:1fr 1fr; gap:var(--space-xl); align-items:center; margin-top:var(--space-xl);}
.who-cards{display:grid; grid-template-columns:1fr 1fr; gap:var(--space-md); margin-top:var(--space-xl);}

/* ---------- Финальный CTA / форма ---------- */
.cta-section{background:var(--color-bg-secondary);}
.cta-grid{display:grid; grid-template-columns:1fr 420px; gap:var(--space-xl); align-items:start;}
.contact-buttons{display:flex; flex-direction:column; gap:12px; margin-top:var(--space-lg); max-width:320px;}

/* ---------- Футер ---------- */
.site-footer{background:var(--color-text-primary); color:var(--color-sand); padding:var(--space-xl) 0; font-size:13px;}
.footer-grid{display:flex; justify-content:space-between; flex-wrap:wrap; gap:var(--space-md);}
.footer-links a{color:var(--color-sand); opacity:.85; margin-left:var(--space-md);}
.footer-links a:first-child{margin-left:0;}
.footer-links a:hover{opacity:1; text-decoration:underline;}

/* ---------- Служебные страницы ---------- */
.doc-page{max-width:760px; margin:0 auto; padding:var(--space-2xl) var(--space-lg);}
.doc-page h1{font-size:36px; margin-bottom:var(--space-md);}
.doc-page h2{font-size:22px; margin-top:var(--space-xl); margin-bottom:var(--space-sm);}
.doc-page p, .doc-page li{font-size:15px; color:var(--color-text-secondary); line-height:1.7;}
.doc-meta{font-size:13px; color:var(--color-text-secondary); margin-bottom:var(--space-lg);}
.todo{
  background:var(--color-fill-soft); border:1px dashed var(--color-sage); border-radius:var(--radius-sm);
  padding:12px 16px; font-size:13px; color:var(--color-olive-dark); margin:var(--space-sm) 0;
}

/* ---------- Спасибо ---------- */
.thanks-page{min-height:70vh; display:flex; align-items:center; justify-content:center; text-align:center;}
.thanks-icon{width:64px; height:64px; margin:0 auto var(--space-md); stroke:var(--color-olive); fill:none; stroke-width:1.4;}

/* ---------- Адаптив ---------- */
@media (max-width:1024px){
  .grid-3{grid-template-columns:1fr 1fr;}
  .steps{grid-template-columns:1fr 1fr;}
  .reviews{grid-template-columns:1fr 1fr;}
  .cta-grid{grid-template-columns:1fr;}
}
@media (max-width:768px){
  section{padding:var(--space-2xl) 0;}
  .container{padding:0 var(--space-md);}
  .grid-2, .grid-3{grid-template-columns:1fr;}
  .split-cards{grid-template-columns:1fr;}
  .steps{grid-template-columns:1fr 1fr;}
  .reviews{grid-template-columns:1fr;}
  .trust-block{grid-template-columns:1fr; text-align:center;}
  .doctor-photo{margin:0 auto; max-width:220px;}
  .fear-block{grid-template-columns:1fr;}
  .who-cards{grid-template-columns:1fr;}
  .footer-grid{flex-direction:column; text-align:center;}
  .footer-links a{margin:0 8px;}
  .hero-arch{width:160px; height:220px;}
}
@media (max-width:390px){
  .steps{grid-template-columns:1fr;}
}

&lt;style&gt;
/* =========================================================

:root{
  --color-bg-primary:#F3F9FC;
  --color-bg-secondary:#E7F4FA;
  --color-surface:#FBFEFF;
  --color-powder:#C5DEF6;
  --color-sky:#7EBADA;
  --color-deep:#4A6FA5;
  --color-deep-dark:#35507D;
  --color-mint:#6FBFAE;
  --color-text-primary:#1F2E42;
  --color-text-secondary:#57708A;
  --color-line:#D6E8F3;
  --color-fill-soft:#EEF7FB;
  --color-success:#5FA98A;
  --color-error:#C06A5E;

  --font-display:&#x27;Yeseva One&#x27;,&#x27;Prata&#x27;,Georgia,serif;
  --font-body:&#x27;Nunito&#x27;,&#x27;Onest&#x27;,-apple-system,BlinkMacSystemFont,sans-serif;

  --space-3xs:4px; --space-2xs:8px; --space-xs:12px; --space-sm:16px;
  --space-md:24px; --space-lg:40px; --space-xl:64px; --space-2xl:96px; --space-3xl:144px;

  --radius-sm:4px; --radius-md:14px; --radius-lg:28px; --radius-xl:44px;

  --shadow-whisper:0 1px 2px rgba(31,46,66,.05);
  --shadow-soft:0 8px 24px rgba(31,46,66,.09);
  --shadow-float:0 16px 40px rgba(31,46,66,.15);

  --container-max:1200px;
  --duration-fast:150ms;
  --ease-standard:cubic-bezier(.4,0,.2,1);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; background:var(--color-bg-primary); color:var(--color-text-primary);
  font-family:var(--font-body); font-size:16px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
img,svg{max-width:100%; display:block;}
a{color:inherit; text-decoration:none;}
.container{max-width:var(--container-max); margin:0 auto; padding:0 var(--space-lg);}

h1,h2,h3,h4{font-family:var(--font-display); font-weight:400; margin:0;}

.eyebrow{
  font-family:var(--font-body); font-weight:800; font-size:13px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--color-deep); margin-bottom:var(--space-sm);
  display:flex; align-items:center; gap:var(--space-2xs);
}
.eyebrow::before{content:&quot;&quot;; width:22px; height:1px; background:var(--color-deep); display:inline-block;}

/* ---------- Кнопки ---------- */
.btn{
  font-family:var(--font-body); font-weight:800; font-size:15px; letter-spacing:.01em;
  padding:14px 28px; border-radius:999px; border:1.5px solid transparent; cursor:pointer;
  transition:all var(--duration-fast) var(--ease-standard); display:inline-flex; align-items:center; gap:8px;
}
.btn-primary{background:var(--color-deep); color:#fff;}
.btn-primary:hover{background:var(--color-deep-dark); transform:translateY(-1px); box-shadow:var(--shadow-soft);}
.btn-primary:focus-visible{outline:3px solid var(--color-mint); outline-offset:2px;}
.btn-primary:active{transform:translateY(0); background:var(--color-deep-dark);}
.btn-primary:disabled{background:var(--color-line); color:var(--color-text-secondary); cursor:not-allowed; transform:none; box-shadow:none;}
.btn-secondary{background:transparent; border-color:var(--color-deep); color:var(--color-deep-dark);}
.btn-secondary:hover{background:var(--color-fill-soft);}
.btn-secondary:focus-visible{outline:3px solid var(--color-mint); outline-offset:2px;}

/* ---------- Формы ---------- */
.field-group{margin-bottom:var(--space-md); text-align:left;}
.field-label{display:block; font-size:13px; font-weight:700; margin-bottom:6px;}
.field-input{
  width:100%; font-family:var(--font-body); font-size:15px; padding:13px 16px;
  border:1.5px solid var(--color-line); border-radius:var(--radius-md); background:var(--color-surface);
  color:var(--color-text-primary); transition:border-color var(--duration-fast);
}
.field-input:focus{outline:none; border-color:var(--color-deep);}
.field-input.error{border-color:var(--color-error);}
.field-hint{font-size:12px; color:var(--color-text-secondary); margin-top:5px;}
.field-hint.error{color:var(--color-error);}
.checkline{display:flex; align-items:flex-start; gap:10px; font-size:14px; margin-bottom:16px; text-align:left; line-height:1.5;}
.checkline input{width:18px; height:18px; accent-color:var(--color-deep); margin-top:2px; flex-shrink:0;}
.checkline a{text-decoration:underline; text-underline-offset:3px;}
.form-status{font-size:14px; margin-top:var(--space-sm); display:none;}
.form-status.visible{display:block;}
.form-status.error{color:var(--color-error);}
.form-status.success{color:var(--color-success);}

/* ---------- Карточки ---------- */
.card{
  background:var(--color-surface); border:1px solid var(--color-line); border-radius:var(--radius-lg);
  padding:var(--space-lg); box-shadow:var(--shadow-whisper);
}
/* Приём версии 2 — капля вместо арки */
.card.arch-top{border-radius:48px 12px var(--radius-lg) var(--radius-lg); text-align:center; padding-top:var(--space-2xl);}

/* ---------- Разделы лендинга ---------- */
section{padding:var(--space-3xl) 0; border-bottom:1px solid var(--color-line);}
section:last-of-type{border-bottom:none;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:var(--space-xl);}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-md);}
.lead{font-size:22px; line-height:1.55; color:var(--color-text-primary); max-width:760px;}

/* ---------- Шапка ---------- */
.site-header{
  position:sticky; top:0; z-index:100; background:rgba(243,249,252,.92); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--color-line); display:flex; align-items:center; justify-content:space-between;
  padding:16px var(--space-lg);
}
.site-logo{font-family:var(--font-display); font-size:21px;}

/* ---------- Первый экран ---------- */
.hero{
  padding:var(--space-3xl) 0; text-align:center; position:relative; overflow:hidden;
  background:radial-gradient(ellipse 60% 50% at 85% 15%, rgba(126,186,218,.35), transparent 60%), var(--color-bg-primary);
}
/* Приём версии 2 — кластер пузырей вместо арки */
.hero-arch{position:absolute; right:6%; top:10%; width:0; height:0; border:none;}
.hero-arch::before{
  content:&quot;&quot;; position:absolute; width:200px; height:200px; right:0; top:0;
  border-radius:50%; border:1.5px solid var(--color-sky); opacity:.35;
}
.hero-arch::after{
  content:&quot;&quot;; position:absolute; width:90px; height:90px; right:120px; top:-40px;
  border-radius:50%; background:var(--color-mint); opacity:.2;
}
.hero h1{font-size:clamp(34px,4.6vw,58px); line-height:1.12; max-width:820px; margin:0 auto;}
.hero p{font-size:20px; color:var(--color-text-secondary); max-width:560px; margin:var(--space-md) auto 0;}
.hero-actions{display:flex; gap:12px; justify-content:center; margin-top:var(--space-lg); flex-wrap:wrap;}

/* ---------- Узнавание (2 ветки) ---------- */
.split-cards{display:grid; grid-template-columns:1fr 1fr; gap:var(--space-lg); margin-top:var(--space-xl);}
.split-card{padding:var(--space-xl); border-radius:var(--radius-lg);}
.split-card.pain{background:var(--color-bg-secondary);}
.split-card.care{background:var(--color-fill-soft);}

/* ---------- Шаги визита ---------- */
.steps{display:grid; grid-template-columns:repeat(4,1fr); gap:var(--space-md); margin-top:var(--space-xl); counter-reset:step;}
.step{position:relative; padding-top:var(--space-md);}
.step .num{font-family:var(--font-display); font-size:44px; color:var(--color-sky);}

/* ---------- Доверие ---------- */
.trust-block{display:grid; grid-template-columns:280px 1fr; gap:var(--space-xl); align-items:center; margin-top:var(--space-xl);}
.doctor-photo{
  aspect-ratio:3/4; border-radius:48px 12px var(--radius-lg) var(--radius-lg);
  background:var(--color-powder); overflow:hidden;
  display:flex; align-items:center; justify-content:center; color:var(--color-deep-dark); font-size:13px; text-align:center; padding:0;
}
.doctor-photo img{width:100%; height:100%; object-fit:cover; object-position:top center;}
.credentials-list{list-style:none; padding:0; margin-top:var(--space-md);}
.credentials-list li{padding:10px 0; border-bottom:1px solid var(--color-line); font-size:15px;}

/* ---------- Отзывы ---------- */
.reviews{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-md); margin-top:var(--space-xl);}
.review-card{background:var(--color-surface); border:1px solid var(--color-line); border-radius:var(--radius-lg); padding:var(--space-lg);}
.review-quote{font-family:var(--font-display); font-style:normal; font-size:18px; line-height:1.5; color:var(--color-deep-dark);}
.review-source{font-size:12px; color:var(--color-text-secondary); margin-top:var(--space-sm);}

/* ---------- Стоимость ---------- */
.price-card{background:var(--color-deep); color:#fff; border-radius:var(--radius-lg); padding:var(--space-2xl); text-align:center; margin-top:var(--space-xl);}
.price-card h3{color:#fff;}
.price-card p{opacity:.85; margin-top:10px;}

/* ---------- Снятие страха / кому подходит ---------- */
.fear-block{display:grid; grid-template-columns:1fr 1fr; gap:var(--space-xl); align-items:center; margin-top:var(--space-xl);}
.who-cards{display:grid; grid-template-columns:1fr 1fr; gap:var(--space-md); margin-top:var(--space-xl);}

/* ---------- Финальный CTA / форма ---------- */
.cta-section{background:var(--color-bg-secondary);}
.cta-grid{display:grid; grid-template-columns:1fr 420px; gap:var(--space-xl); align-items:start;}
.contact-buttons{display:flex; flex-direction:column; gap:12px; margin-top:var(--space-lg); max-width:320px;}

/* ---------- Футер ---------- */
.site-footer{background:var(--color-text-primary); color:var(--color-powder); padding:var(--space-xl) 0; font-size:13px;}
.footer-grid{display:flex; justify-content:space-between; flex-wrap:wrap; gap:var(--space-md);}
.footer-links a{color:var(--color-powder); opacity:.85; margin-left:var(--space-md);}
.footer-links a:first-child{margin-left:0;}
.footer-links a:hover{opacity:1; text-decoration:underline;}

/* ---------- Служебные страницы ---------- */
.doc-page{max-width:760px; margin:0 auto; padding:var(--space-2xl) var(--space-lg);}
.doc-page h1{font-size:36px; margin-bottom:var(--space-md);}
.doc-page h2{font-size:22px; margin-top:var(--space-xl); margin-bottom:var(--space-sm);}
.doc-page p, .doc-page li{font-size:15px; color:var(--color-text-secondary); line-height:1.7;}
.doc-meta{font-size:13px; color:var(--color-text-secondary); margin-bottom:var(--space-lg);}
.todo{
  background:var(--color-fill-soft); border:1px dashed var(--color-sky); border-radius:var(--radius-sm);
  padding:12px 16px; font-size:13px; color:var(--color-deep-dark); margin:var(--space-sm) 0;
}

/* ---------- Спасибо ---------- */
.thanks-page{min-height:70vh; display:flex; align-items:center; justify-content:center; text-align:center;}
.thanks-icon{width:64px; height:64px; margin:0 auto var(--space-md); stroke:var(--color-deep); fill:none; stroke-width:1.4;}

/* ---------- Адаптив ---------- */
@media (max-width:1024px){
  .grid-3{grid-template-columns:1fr 1fr;}
  .steps{grid-template-columns:1fr 1fr;}
  .reviews{grid-template-columns:1fr 1fr;}
  .cta-grid{grid-template-columns:1fr;}
}
@media (max-width:768px){
  section{padding:var(--space-2xl) 0;}
  .container{padding:0 var(--space-md);}
  .grid-2, .grid-3{grid-template-columns:1fr;}
  .split-cards{grid-template-columns:1fr;}
  .steps{grid-template-columns:1fr 1fr;}
  .reviews{grid-template-columns:1fr;}
  .trust-block{grid-template-columns:1fr; text-align:center;}
  .doctor-photo{margin:0 auto; max-width:220px;}
  .fear-block{grid-template-columns:1fr;}
  .who-cards{grid-template-columns:1fr;}
  .footer-grid{flex-direction:column; text-align:center;}
  .footer-links a{margin:0 8px;}
  .hero-arch::before{width:130px; height:130px;}
  .hero-arch::after{width:60px; height:60px; right:80px;}
}
@media (max-width:390px){
  .steps{grid-template-columns:1fr;}
}
